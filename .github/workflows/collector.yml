name: Prospective collector

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospective-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out public collector repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run collector
        env:
          GH_API_TOKEN: ${{ github.token }}
          DATA_REPO_URL: ${{ secrets.DATA_REPO_URL }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          SAMPLING_KEY: ${{ secrets.SAMPLING_KEY }}

          PROTOCOL_VERSION: "v1"
          DATA_REPO_BRANCH: "main"

          # Freeze these values before production starts.
          START_HOUR: ${{ vars.START_HOUR }}
          SAMPLING_PROBABILITY: ${{ vars.SAMPLING_PROBABILITY }}

          SAFETY_LAG_HOURS: "3"
          MAX_ARCHIVE_HOURS_PER_RUN: "8"
          MAX_TASKS_PER_RUN: "250"
          API_RATE_LIMIT_RESERVE: "75"
          API_MAX_SLEEP_SECONDS: "120"
        run: python -m collector run
